sentence=Statistiques et régressions pour l'embarqué, sans allocation dynamique.
paragraph=Portage Arduino du projet Qt Fo170/Statistiques. Fournit moyenne, variance, écart-type, médiane, MAD, min/max, covariance, corrélation, tri croissant, et 9 modèles de régression (linéaire, logarithmique, exponentielle, puissance, inverse, polynôme de degré 2) avec évaluation et coefficient de détermination R². Les algorithmes sont ceux du projet d'origine, réécrits en float avec des tableaux statiques de taille fixe : rien n'est alloué sur le tas.
